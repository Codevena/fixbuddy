name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  shell:
    name: Shell checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # One file per invocation — `bash -n a b c` only checks the first file
      # (the rest become positional parameters).
      - name: Bash syntax
        run: |
          bash -n fixbuddy.sh
          bash -n fixbuddy-wizard.sh
          bash -n install.sh
          bash -n action-collect-logs.sh
          bash -n tests/integration.sh
          bash -n tests/stubs/agent
          bash -n tests/stubs/gh
          bash -n tests/stubs/curl
          bash -n tests/stubs/git-push-race

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: ShellCheck
        run: shellcheck fixbuddy.sh fixbuddy-wizard.sh install.sh action-collect-logs.sh tests/integration.sh tests/stubs/agent tests/stubs/gh tests/stubs/curl tests/stubs/git-push-race

      - name: Python syntax and terminal UI tests
        run: |
          python3 -m py_compile fixbuddy-tui.py
          python3 -m unittest discover -s tests -p 'test_tui.py'

  integration:
    name: Integration tests (mocked CLIs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run integration tests
        run: tests/integration.sh
